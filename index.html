<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>আপন হাট - অনলাইন শপ</title>
    <meta name="description" content="আপন হাট: নিত্যপ্রয়োজনীয় পণ্য, সাশ্রয়ী দামে হোম ডেলিভারি।">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap">
    <style>
        html { -webkit-text-size-adjust: 100%; }
        body { font-family: 'Hind Siliguri', sans-serif; font-size: 16px; }
        button, a, select { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen pb-32">

    <header class="bg-green-700 text-white sticky top-0 z-30 shadow">
        <div class="max-w-5xl mx-auto px-4 pt-3 pb-2 flex items-center justify-between gap-2">
            <h1 class="font-bold text-2xl">আপন হাট</h1>
            <div id="user-area" class="text-sm flex items-center gap-2"></div>
        </div>
        <div class="max-w-5xl mx-auto px-4 pb-3">
            <input id="search" type="search" placeholder="পণ্য খুঁজুন..."
                class="w-full p-3 rounded-xl text-slate-800 outline-none text-base">
        </div>
    </header>

    <div id="helper-banner" class="hidden bg-orange-100 text-orange-800 text-xs font-bold text-center py-2 px-4"></div>

    <main class="max-w-5xl mx-auto px-3 pt-3 sm:px-4">
        <div id="categories" class="flex gap-2 overflow-x-auto no-scrollbar pb-3"></div>
        <div id="status" class="text-center text-slate-400 py-16">লোড হচ্ছে...</div>
        <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </main>

    <!-- নিচের ব্যাগ বার -->
    <div id="cart-bar" class="hidden fixed bottom-0 inset-x-0 z-30 px-3 pt-3" style="padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 0.75rem);">
        <button id="open-cart" class="max-w-5xl mx-auto w-full bg-green-600 text-white rounded-2xl py-4 px-5 shadow-xl flex justify-between text-lg font-bold active:scale-95 transition">
            <span>🛍 ব্যাগ (<span id="bar-count">0</span>)</span>
            <span id="bar-total"></span>
        </button>
    </div>

    <!-- ব্যাগ ও অর্ডার ফর্ম -->
    <div id="sheet" class="hidden fixed inset-0 z-40 bg-black/50 flex items-end justify-center">
        <div class="bg-white w-full max-w-lg rounded-t-3xl overflow-y-auto p-5" style="max-height: 92vh; max-height: 92dvh; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 1.25rem);">
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-bold text-lg">আপনার ব্যাগ</h2>
                <button id="close-cart" class="text-slate-400 text-2xl leading-none w-11 h-11 -mr-2">✕</button>
            </div>
            <div id="cart-items" class="space-y-2"></div>

            <div id="order-form" class="mt-4 space-y-3">
                <div class="flex bg-slate-100 rounded-xl p-1 text-sm font-bold">
                    <button type="button" id="m-home" class="flex-1 py-3 rounded-lg">🏠 হোম ডেলিভারি</button>
                    <button type="button" id="m-shop" class="flex-1 py-3 rounded-lg">🏪 শপ থেকে নেব</button>
                </div>
                <input id="c-name" maxlength="100" placeholder="গ্রাহকের নাম" class="w-full p-3 border rounded-xl">
                <input id="c-phone" inputmode="tel" maxlength="20" placeholder="মোবাইল নম্বর (01XXXXXXXXX)" class="w-full p-3 border rounded-xl">
                <textarea id="c-address" rows="2" maxlength="300" placeholder="পূর্ণ ঠিকানা (গ্রাম/পাড়া, ল্যান্ডমার্ক)" class="w-full p-3 border rounded-xl"></textarea>

                <div class="bg-slate-50 rounded-xl p-3 text-sm space-y-1">
                    <div class="flex justify-between"><span>পণ্যের দাম</span><b id="t-sub"></b></div>
                    <div class="flex justify-between"><span>ডেলিভারি চার্জ (<span id="t-weight"></span> কেজি)</span><b id="t-del"></b></div>
                    <div class="flex justify-between text-green-700 text-base border-t pt-1"><span>মোট (ক্যাশ অন ডেলিভারি)</span><b id="t-total"></b></div>
                </div>
                <button id="submit-order" class="w-full bg-green-600 text-white py-4 rounded-2xl text-lg font-bold active:scale-95 transition disabled:opacity-60">অর্ডার কনফার্ম করুন</button>
                <p id="order-msg" class="text-center text-sm font-bold"></p>
            </div>
        </div>
    </div>

    <!-- ছবি বড় করে দেখা -->
    <div id="zoom" class="hidden fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
        <img id="zoom-img" class="max-h-full max-w-full rounded-xl" alt="">
    </div>

    <script type="module">
        import { db, auth } from "./firebase-config.js";
        import { getProfile, ROLE_HOME, logout } from "./auth-guard.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { collection, getDocs, getDoc, doc, addDoc, serverTimestamp }
            from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const $ = (id) => document.getElementById(id);
        const PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="300" height="300" fill="#e2e8f0"/><text x="150" y="160" font-size="20" text-anchor="middle" fill="#94a3b8">ছবি নেই</text></svg>');
        const taka = (n) => "৳" + Number(n).toLocaleString("bn-BD");

        // নিরাপদ এলিমেন্ট বানানোর ছোট সাহায্যকারী (ইউজারের লেখা সরাসরি HTML হয় না)
        function h(tag, props = {}, ...kids) {
            const e = document.createElement(tag);
            for (const [k, v] of Object.entries(props)) {
                if (k === "class") e.className = v;
                else if (k === "text") e.textContent = v;
                else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
                else if (v !== undefined && v !== null) e.setAttribute(k, v);
            }
            for (const kid of kids.flat()) if (kid != null) e.append(kid);
            return e;
        }

        let products = [];            // সব পণ্য
        let rules = [];               // ডেলিভারি চার্জের নিয়ম
        let method = "home";          // home | shop
        let profile = null;           // লগইন করা ইউজারের প্রোফাইল
        let activeCat = "সব";
        const cart = new Map();       // পণ্যের id -> পরিমাণ

        // ---------- ব্যাগ সংরক্ষণ (শুধু id ও পরিমাণ) ----------
        function loadCart() {
            try {
                const o = JSON.parse(localStorage.getItem("aponhat_cart") || "{}");
                for (const [id, q] of Object.entries(o)) if (Number.isInteger(q) && q > 0) cart.set(id, q);
            } catch (e) { /* সমস্যা নেই */ }
        }
        function saveCart() {
            try { localStorage.setItem("aponhat_cart", JSON.stringify(Object.fromEntries(cart))); } catch (e) { /* সমস্যা নেই */ }
        }

        // ---------- ডাটা লোড ----------
        function normalize(d) {
            const x = d.data();
            let images = x.images ?? x.image ?? [];
            if (typeof images === "string") images = images ? [images] : [];
            return {
                id: d.id,
                name: String(x.name || ""),
                category: String(x.category || "অন্যান্য"),
                images,
                sellPrice: Number(x.sellPrice) || 0,
                regularPrice: Number(x.regularPrice) || 0,
                weight: Number(x.weight) || 0,
                stock: Math.max(0, Math.floor(Number(x.stock) || 0)),
                description: String(x.description || ""),
                t: x.createdAt?.seconds || 0
            };
        }

        async function loadAll() {
            try {
                const [pSnap, sSnap] = await Promise.all([
                    getDocs(collection(db, "products")),
                    getDoc(doc(db, "settings", "delivery"))
                ]);
                products = pSnap.docs.map(normalize).sort((a, b) => b.t - a.t);
                rules = (sSnap.exists() && Array.isArray(sSnap.data().rules))
                    ? sSnap.data().rules.map(r => ({ maxW: Number(r.maxW), charge: Number(r.charge) }))
                        .filter(r => !isNaN(r.maxW) && !isNaN(r.charge)).sort((a, b) => a.maxW - b.maxW)
                    : [];
                // ব্যাগ ঠিক করা: নেই এমন পণ্য বাদ, স্টকের বেশি হলে কমানো
                for (const [id, q] of cart) {
                    const p = products.find(x => x.id === id);
                    if (!p || p.stock <= 0) cart.delete(id);
                    else if (q > p.stock) cart.set(id, p.stock);
                }
                saveCart();
                $("status").style.display = products.length ? "none" : "block";
                if (!products.length) $("status").textContent = "এখনো কোনো পণ্য যোগ করা হয়নি।";
                renderCategories();
                renderGrid();
                renderBar();
            } catch (e) {
                console.error(e);
                $("status").textContent = "পণ্য লোড করা যায়নি। ইন্টারনেট চেক করে আবার চেষ্টা করুন।";
            }
        }

        // ---------- পণ্য দেখানো ----------
        function renderCategories() {
            const box = $("categories");
            box.innerHTML = "";
            const cats = ["সব", ...new Set(products.map(p => p.category))];
            cats.forEach(c => {
                box.append(h("button", {
                    class: "shrink-0 px-5 py-2.5 rounded-2xl text-sm font-bold border " +
                        (c === activeCat ? "bg-green-600 text-white border-green-600" : "bg-white text-slate-600"),
                    text: c,
                    onclick: () => { activeCat = c; renderCategories(); renderGrid(); }
                }));
            });
        }

        function renderGrid() {
            const term = $("search").value.trim().toLowerCase();
            const list = products.filter(p =>
                (activeCat === "সব" || p.category === activeCat) &&
                (!term || p.name.toLowerCase().includes(term) || p.description.toLowerCase().includes(term)));
            const grid = $("grid");
            grid.innerHTML = "";
            if (!list.length && products.length) {
                grid.append(h("p", { class: "col-span-full text-center text-slate-400 py-16", text: "কোনো পণ্য পাওয়া যায়নি" }));
                return;
            }
            list.forEach(p => grid.append(productCard(p)));
        }

        function productCard(p) {
            let qty = 1;
            const soldOut = p.stock <= 0;

            const main = h("img", { class: "w-full h-full object-cover cursor-zoom-in", alt: p.name, src: p.images[0] || PLACEHOLDER });
            main.addEventListener("click", () => { $("zoom-img").src = main.src; $("zoom").classList.remove("hidden"); });

            const imgBox = h("div", { class: "relative aspect-[4/3] bg-slate-100 rounded-2xl overflow-hidden" }, main);
            if (p.regularPrice > p.sellPrice && p.sellPrice > 0) {
                const pct = Math.round(((p.regularPrice - p.sellPrice) / p.regularPrice) * 100);
                imgBox.append(h("span", { class: "absolute top-2 right-2 bg-red-600 text-white text-xs font-bold px-2.5 py-1 rounded-full", text: pct + "% ছাড়" }));
            }
            if (soldOut) imgBox.append(h("div", { class: "absolute inset-0 bg-white/70 flex items-center justify-center font-bold text-red-600", text: "স্টক শেষ" }));

            const thumbs = p.images.length > 1
                ? h("div", { class: "flex gap-2 mt-2 overflow-x-auto no-scrollbar" },
                    p.images.map(src => {
                        const t = h("img", { src, alt: p.name, class: "w-14 h-14 object-cover rounded-xl border cursor-pointer shrink-0" });
                        t.addEventListener("click", () => { main.src = src; });
                        return t;
                    }))
                : null;

            const desc = h("p", { class: "hidden text-sm text-slate-600 mt-1 bg-slate-50 p-3 rounded-xl", text: p.description || "বিবরণ নেই।" });
            const qtyText = h("span", { class: "w-8 text-center font-bold text-base", text: "1" });
            const setQty = (d) => { qty = Math.min(Math.max(1, qty + d), Math.max(1, p.stock)); qtyText.textContent = qty; };

            const priceBox = p.regularPrice > p.sellPrice
                ? h("div", {}, h("span", { class: "text-sm text-slate-400 line-through mr-1", text: taka(p.regularPrice) }),
                    h("span", { class: "text-green-600 font-black text-2xl", text: taka(p.sellPrice) }))
                : h("span", { class: "text-green-600 font-black text-2xl", text: taka(p.sellPrice) });

            const addBtn = h("button", {
                class: "flex-1 bg-green-600 text-white text-base font-bold py-3.5 rounded-xl active:scale-95 transition disabled:bg-slate-300",
                text: "ব্যাগে ভরুন",
                onclick: () => {
                    const cur = cart.get(p.id) || 0;
                    if (cur + qty > p.stock) return alert(`স্টকে মাত্র ${p.stock}টি আছে।`);
                    cart.set(p.id, cur + qty);
                    saveCart(); renderBar();
                    qty = 1; qtyText.textContent = "1";
                }
            });
            if (soldOut) addBtn.disabled = true;

            return h("div", { class: "bg-white rounded-3xl shadow-sm p-3 flex flex-col" },
                imgBox, thumbs,
                h("h3", { class: "font-bold text-slate-800 text-lg leading-snug mt-3", text: p.name }),
                h("div", { class: "mt-1 flex items-center justify-between" }, priceBox,
                    h("button", { class: "text-sm text-blue-500 font-bold px-2 py-2", text: "বিবরণ", onclick: () => desc.classList.toggle("hidden") })),
                desc,
                h("div", { class: "flex items-center gap-3 mt-3" },
                    h("div", { class: "flex items-center bg-slate-100 rounded-xl" },
                        h("button", { class: "w-11 h-12 text-xl font-bold", text: "−", onclick: () => setQty(-1) }), qtyText,
                        h("button", { class: "w-11 h-12 text-xl font-bold", text: "+", onclick: () => setQty(1) })),
                    addBtn));
        }

        // ---------- হিসাব ----------
        function calc() {
            const items = [];
            let subtotal = 0, weight = 0;
            for (const [id, q] of cart) {
                const p = products.find(x => x.id === id);
                if (!p) continue;
                items.push({ id, name: p.name, price: p.sellPrice, qty: q, weight: p.weight });
                subtotal += p.sellPrice * q;
                weight += p.weight * q;
            }
            let charge = 0;
            if (items.length && method === "home" && rules.length) {
                const r = rules.find(x => weight <= x.maxW) || rules[rules.length - 1];
                charge = r.charge;
            }
            return { items, subtotal, weight: Math.round(weight * 100) / 100, charge, total: subtotal + charge };
        }

        function renderBar() {
            const c = calc();
            const count = c.items.reduce((a, i) => a + i.qty, 0);
            $("cart-bar").classList.toggle("hidden", count === 0);
            $("bar-count").textContent = count.toLocaleString("bn-BD");
            $("bar-total").textContent = taka(c.total);
            if (!$("sheet").classList.contains("hidden")) renderCart();
        }

        function renderCart() {
            const c = calc();
            const box = $("cart-items");
            box.innerHTML = "";
            if (!c.items.length) {
                box.append(h("p", { class: "text-center text-slate-400 py-8", text: "ব্যাগ খালি!" }));
                $("order-form").classList.add("hidden");
                return;
            }
            $("order-form").classList.remove("hidden");
            c.items.forEach(i => {
                const p = products.find(x => x.id === i.id);
                box.append(h("div", { class: "flex items-center gap-2 bg-slate-50 rounded-2xl p-3" },
                    h("div", { class: "flex-1 min-w-0" },
                        h("p", { class: "text-base font-bold truncate", text: i.name }),
                        h("p", { class: "text-sm text-slate-500", text: `${taka(i.price)} × ${i.qty} = ${taka(i.price * i.qty)}` })),
                    h("button", { class: "w-10 h-10 bg-white rounded-xl font-bold shadow-sm", text: "−", onclick: () => changeQty(i.id, -1) }),
                    h("span", { class: "w-6 text-center font-bold", text: String(i.qty) }),
                    h("button", { class: "w-10 h-10 bg-white rounded-xl font-bold shadow-sm", text: "+", onclick: () => { if (i.qty >= p.stock) return alert(`স্টকে মাত্র ${p.stock}টি আছে।`); changeQty(i.id, 1); } }),
                    h("button", { class: "text-red-400 w-10 h-10 text-lg", text: "🗑", onclick: () => { cart.delete(i.id); saveCart(); renderBar(); } })));
            });
            $("t-sub").textContent = taka(c.subtotal);
            $("t-weight").textContent = c.weight.toLocaleString("bn-BD");
            $("t-del").textContent = method === "shop" ? "০ (শপ পিকআপ)" : taka(c.charge);
            $("t-total").textContent = taka(c.total);
        }

        function changeQty(id, d) {
            const q = (cart.get(id) || 0) + d;
            if (q < 1) cart.delete(id); else cart.set(id, q);
            saveCart(); renderBar();
        }

        function setMethod(m) {
            method = m;
            const on = "flex-1 py-3 rounded-lg bg-white shadow text-green-700";
            const off = "flex-1 py-3 rounded-lg text-slate-500";
            $("m-home").className = m === "home" ? on : off;
            $("m-shop").className = m === "shop" ? on : off;
            $("c-address").style.display = m === "shop" ? "none" : "block";
            renderBar();
        }

        // ---------- গ্রাহকের তথ্য মনে রাখা (এই ফোনেই থাকে) ----------
        function saveCustomer(name, phone, address) {
            try { localStorage.setItem("aponhat_customer", JSON.stringify({ name, phone, address })); } catch (e) { /* সমস্যা নেই */ }
        }
        function loadCustomer() {
            try {
                const c = JSON.parse(localStorage.getItem("aponhat_customer") || "null");
                if (!c) return;
                $("c-name").value = c.name || "";
                $("c-phone").value = c.phone || "";
                $("c-address").value = c.address && c.address !== "শপ পিকআপ" ? c.address : "";
            } catch (e) { /* সমস্যা নেই */ }
        }

        // ---------- অর্ডার ----------
        let ordering = false;
        async function submitOrder() {
            if (ordering) return;
            const msg = $("order-msg");
            const setMsg = (t, ok) => { msg.textContent = t; msg.className = "text-center text-sm font-bold " + (ok ? "text-green-600" : "text-red-600"); };

            const name = $("c-name").value.trim();
            const phone = $("c-phone").value.replace(/[\s-]/g, "");
            const address = $("c-address").value.trim();
            if (!name) return setMsg("নাম দিন");
            if (!/^01[3-9]\d{8}$/.test(phone)) return setMsg("সঠিক ১১ ডিজিটের মোবাইল নম্বর দিন");
            if (method === "home" && address.length < 5) return setMsg("পূর্ণ ঠিকানা দিন");
            if (!cart.size) return setMsg("ব্যাগ খালি!");

            ordering = true;
            $("submit-order").disabled = true;
            $("submit-order").textContent = "যাচাই হচ্ছে...";
            setMsg("");

            try {
                // অর্ডারের আগে প্রতিটি পণ্যের সর্বশেষ দাম ও স্টক দেখা
                const ids = [...cart.keys()];
                const fresh = await Promise.all(ids.map(id => getDoc(doc(db, "products", id))));
                let changed = false;
                fresh.forEach((snap, k) => {
                    const id = ids[k];
                    if (!snap.exists()) { cart.delete(id); changed = true; return; }
                    const np = normalize(snap);
                    const idx = products.findIndex(x => x.id === id);
                    const old = products[idx];
                    if (old && (old.sellPrice !== np.sellPrice || old.stock !== np.stock)) changed = true;
                    if (idx >= 0) products[idx] = { ...np, images: old?.images?.length ? old.images : np.images };
                    if (np.stock <= 0) cart.delete(id);
                    else if (cart.get(id) > np.stock) cart.set(id, np.stock);
                });
                if (changed) {
                    saveCart(); renderGrid(); renderBar();
                    setMsg("কিছু পণ্যের দাম বা স্টক বদলেছে। ব্যাগ দেখে আবার কনফার্ম করুন।");
                    return;
                }

                const c = calc();
                const isHelper = profile?.role === "helper";
                const ref = await addDoc(collection(db, "orders"), {
                    customerName: name,
                    customerPhone: phone,
                    customerAddress: method === "shop" ? "শপ পিকআপ" : address,
                    deliveryMethod: method,
                    items: c.items,
                    subtotal: c.subtotal,
                    deliveryCharge: c.charge,
                    totalBill: c.total,
                    status: "pending",
                    helperId: isHelper ? auth.currentUser.uid : null,
                    helperName: isHelper ? (profile.name || null) : null,
                    helperCommissionRate: isHelper ? (Number(profile.commissionRate) || 0) : 0,
                    commissionProcessed: false,
                    stockDeducted: false,
                    deliveryManId: null,
                    createdAt: serverTimestamp()
                });

                cart.clear(); saveCart();
                saveCustomer(name, phone, address);
                renderBar(); renderCart();
                $("cart-items").innerHTML = "";
                $("cart-items").append(h("div", { class: "text-center py-8" },
                    h("p", { class: "text-3xl", text: "✅" }),
                    h("p", { class: "font-bold text-green-700 mt-2", text: "অর্ডার সফল হয়েছে!" }),
                    h("p", { class: "text-xs text-slate-500 mt-1", text: "অর্ডার নম্বর: " + ref.id.slice(0, 8).toUpperCase() }),
                    h("p", { class: "text-xs text-slate-500", text: "আমরা শীঘ্রই ফোনে যোগাযোগ করব।" })));
                $("order-form").classList.add("hidden");
            } catch (e) {
                console.error(e);
                setMsg("অর্ডার হয়নি: " + (e.code === "permission-denied" ? "অনুমতি নেই (Firestore Rules চেক করুন)" : (e.code || e.message)));
            } finally {
                ordering = false;
                $("submit-order").disabled = false;
                $("submit-order").textContent = "অর্ডার কনফার্ম করুন";
            }
        }

        // ---------- ইউজার এলাকা ----------
        onAuthStateChanged(auth, async (u) => {
            const area = $("user-area");
            area.innerHTML = "";
            profile = null;
            $("helper-banner").classList.add("hidden");
            if (!u) {
                area.append(h("a", { href: "login.html", class: "bg-white/20 px-3 py-1.5 rounded-lg font-bold", text: "স্টাফ লগইন" }));
                return;
            }
            try { profile = await getProfile(u.uid); } catch (e) { console.error(e); }
            if (profile && ROLE_HOME[profile.role]) {
                area.append(
                    h("a", { href: ROLE_HOME[profile.role], class: "bg-white/20 px-3 py-1.5 rounded-lg font-bold", text: (profile.name || "ড্যাশবোর্ড").split(" ")[0] }),
                    h("button", { class: "bg-red-500 px-2.5 py-1.5 rounded-lg font-bold", text: "লগআউট", onclick: logout }));
                if (profile.role === "helper") {
                    $("helper-banner").textContent = `হেলপার মোড: আপনার নামে অর্ডার জমা হবে, কমিশন ${profile.commissionRate ?? 0}%`;
                    $("helper-banner").classList.remove("hidden");
                }
            } else {
                area.append(h("button", { class: "bg-red-500 px-2.5 py-1.5 rounded-lg font-bold", text: "লগআউট", onclick: logout }));
            }
        });

        // ---------- ইভেন্ট ----------
        $("search").addEventListener("input", renderGrid);
        $("open-cart").onclick = () => { $("sheet").classList.remove("hidden"); $("order-msg").textContent = ""; renderCart(); };
        $("close-cart").onclick = () => $("sheet").classList.add("hidden");
        $("sheet").addEventListener("click", (e) => { if (e.target.id === "sheet") $("sheet").classList.add("hidden"); });
        $("zoom").onclick = () => $("zoom").classList.add("hidden");
        $("m-home").onclick = () => setMethod("home");
        $("m-shop").onclick = () => setMethod("shop");
        $("submit-order").onclick = submitOrder;

        loadCart();
        loadCustomer();
        setMethod("home");
        loadAll();
    </script>
</body>
</html>
