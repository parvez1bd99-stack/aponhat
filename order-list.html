<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অর্ডার তালিকা | আপন হাট</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { scrollbar-width: none; }
    </style>
</head>
<body style="display:none" class="bg-slate-100 min-h-screen pb-10">
    <header class="bg-green-700 text-white sticky top-0 z-20 shadow">
        <div class="p-4 flex items-center gap-3">
            <a href="owner-dashboard.html" class="text-xl">←</a>
            <h1 class="font-bold text-lg">অর্ডার তালিকা</h1>
        </div>
        <div class="px-4 pb-3">
            <input id="search" type="search" placeholder="নাম / ফোন / অর্ডার নম্বর"
                class="w-full p-2.5 rounded-xl text-slate-800 outline-none text-sm">
        </div>
        <div id="tabs" class="flex gap-2 overflow-x-auto no-scrollbar px-4 pb-3"></div>
    </header>

    <main class="max-w-2xl mx-auto p-3 space-y-3">
        <div id="state" class="text-center text-slate-400 py-16">লোড হচ্ছে...</div>
        <div id="list" class="space-y-3"></div>
    </main>

    <script type="module">
        import { db } from "./firebase-config.js";
        import { requireRole } from "./auth-guard.js";
        import {
            collection, doc, query, orderBy, limit, where, onSnapshot, getDocs,
            updateDoc, deleteDoc, runTransaction, increment, serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        await requireRole(['owner']);

        const $ = (id) => document.getElementById(id);
        const taka = (n) => "৳" + Number(n || 0).toLocaleString("bn-BD");
        const STATUS = {
            pending:   { label: "নতুন",       cls: "bg-orange-100 text-orange-700" },
            confirmed: { label: "কনফার্মড",   cls: "bg-blue-100 text-blue-700" },
            shipping:  { label: "পথে",        cls: "bg-purple-100 text-purple-700" },
            delivered: { label: "ডেলিভার্ড",  cls: "bg-green-100 text-green-700" },
            cancelled: { label: "বাতিল",      cls: "bg-red-100 text-red-700" }
        };

        function h(tag, props = {}, ...kids) {
            const e = document.createElement(tag);
            for (const [k, v] of Object.entries(props)) {
                if (k === "class") e.className = v;
                else if (k === "text") e.textContent = v;
                else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
                else if (v !== undefined && v !== null) e.setAttribute(k, v);
            }
            for (const kid of kids.flat()) if (kid != null) e.append(kid);
            return e;
        }

        let orders = [];
        let deliveryMen = [];
        let activeTab = "pending";
        const settling = new Set();
        const pendingChoice = {}; // অর্ডার id -> বাছাই করা ডেলিভারি ম্যান (কনফার্মের আগ পর্যন্ত)

        // ---------- ডেলিভারি ম্যানদের তালিকা ----------
        try {
            const s = await getDocs(query(collection(db, "users"), where("role", "==", "delivery")));
            deliveryMen = s.docs.map(d => ({ id: d.id, name: d.data().name || d.data().email || "ডেলিভারি ম্যান", rate: Number(d.data().deliveryCommissionRate) || 0 }));
        } catch (e) { console.error(e); }

        // ---------- লাইভ অর্ডার ----------
        onSnapshot(query(collection(db, "orders"), orderBy("createdAt", "desc"), limit(200)), (snap) => {
            orders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            $("state").style.display = "none";
            render();
            // ডেলিভারি হয়ে গেছে কিন্তু কমিশন এখনো যোগ হয়নি, এমন অর্ডারের কমিশন স্বয়ংক্রিয়ভাবে যোগ
            orders.filter(o => o.status === "delivered" && !settling.has(o.id) && ((o.helperId && !o.commissionProcessed) || (o.deliveryManId && !o.deliveryPayProcessed)))
                .forEach(o => {
                    settling.add(o.id);
                    settleCommission(o.id).catch(e => console.error("কমিশন যোগ হয়নি:", o.id, e))
                        .finally(() => settling.delete(o.id));
                });
        }, (err) => {
            console.error(err);
            $("state").style.display = "block";
            $("state").textContent = "অর্ডার লোড হয়নি: " + (err.code || err.message);
        });

        // ---------- ট্রানজ্যাকশন: কনফার্ম ----------
        function qtyMap(items) {
            const m = {};
            for (const it of items || []) m[it.id] = (m[it.id] || 0) + (Number(it.qty) || 0);
            return m;
        }

        async function confirmOrder(id, man) {
            const orderRef = doc(db, "orders", id);
            return runTransaction(db, async (tx) => {
                const oSnap = await tx.get(orderRef);
                if (!oSnap.exists()) throw new Error("অর্ডারটি পাওয়া যায়নি");
                const o = oSnap.data();
                if (o.status !== "pending") throw new Error("অর্ডারটি আর নতুন অবস্থায় নেই");

                const q = qtyMap(o.items);
                const ids = Object.keys(q);
                const pSnaps = await Promise.all(ids.map(pid => tx.get(doc(db, "products", pid))));
                const sSnap = await tx.get(doc(db, "settings", "delivery"));

                let subtotal = 0, weight = 0;
                const items = [];
                const stockUpdates = [];
                pSnaps.forEach((ps, k) => {
                    const pid = ids[k];
                    if (!ps.exists()) throw new Error("পণ্যটি মুছে ফেলা হয়েছে: " + (o.items.find(i => i.id === pid)?.name || pid));
                    const p = ps.data();
                    const stock = Number(p.stock) || 0;
                    if (stock < q[pid]) throw new Error(`স্টক কম: ${p.name} (আছে ${stock}টি, লাগবে ${q[pid]}টি)`);
                    const price = Number(p.sellPrice) || 0;
                    const w = Number(p.weight) || 0;
                    subtotal += price * q[pid];
                    weight += w * q[pid];
                    items.push({ id: pid, name: p.name, price, qty: q[pid], weight: w });
                    stockUpdates.push({ ref: ps.ref, newStock: stock - q[pid] });
                });

                let charge = 0;
                if (o.deliveryMethod === "home" && sSnap.exists() && Array.isArray(sSnap.data().rules)) {
                    const rules = sSnap.data().rules
                        .map(r => ({ maxW: Number(r.maxW), charge: Number(r.charge) }))
                        .filter(r => !isNaN(r.maxW) && !isNaN(r.charge))
                        .sort((a, b) => a.maxW - b.maxW);
                    if (rules.length) charge = (rules.find(r => weight <= r.maxW) || rules[rules.length - 1]).charge;
                }
                const total = subtotal + charge;

                stockUpdates.forEach(u => tx.update(u.ref, { stock: u.newStock }));
                tx.update(orderRef, {
                    items, subtotal, deliveryCharge: charge, totalBill: total,
                    status: "confirmed", stockDeducted: true, confirmedAt: serverTimestamp(),
                    deliveryManId: man ? man.id : null,
                    deliveryManName: man ? man.name : null,
                    deliveryManRate: man ? (Number(man.rate) || 0) : 0,
                    deliveryPayProcessed: false
                });
                return { before: Number(o.totalBill) || 0, after: total };
            });
        }

        // ---------- ট্রানজ্যাকশন: বাতিল (স্টক ও সব আয় ফেরত) ----------
        async function cancelOrder(id) {
            const orderRef = doc(db, "orders", id);
            return runTransaction(db, async (tx) => {
                const oSnap = await tx.get(orderRef);
                if (!oSnap.exists()) throw new Error("অর্ডারটি পাওয়া যায়নি");
                const o = oSnap.data();
                if (o.status === "cancelled") throw new Error("অর্ডারটি আগেই বাতিল হয়েছে");

                const q = qtyMap(o.items);
                let pSnaps = [];
                if (o.stockDeducted) {
                    pSnaps = await Promise.all(Object.keys(q).map(pid => tx.get(doc(db, "products", pid))));
                }
                let hRef = null, hSnap = null, mRef = null, mSnap = null;
                if (o.commissionProcessed && o.helperId) {
                    hRef = doc(db, "users", o.helperId);
                    hSnap = await tx.get(hRef);
                }
                if (o.deliveryPayProcessed && o.deliveryManId) {
                    mRef = doc(db, "users", o.deliveryManId);
                    mSnap = await tx.get(mRef);
                }

                // --- সব পড়া শেষ, এবার লেখা ---
                pSnaps.forEach(ps => {
                    if (ps.exists()) tx.update(ps.ref, { stock: (Number(ps.data().stock) || 0) + (q[ps.id] || 0) });
                });
                if (hSnap && hSnap.exists()) {
                    const amt = Number(o.earnedCommission) || 0;
                    tx.update(hRef, { walletBalance: increment(-amt), totalEarned: increment(-amt) });
                }
                if (mSnap && mSnap.exists()) {
                    const amt = Number(o.deliveryEarned) || 0;
                    tx.update(mRef, { walletBalance: increment(-amt), totalEarned: increment(-amt) });
                }
                tx.update(orderRef, {
                    status: "cancelled", stockDeducted: false,
                    commissionProcessed: false, earnedCommission: 0,
                    deliveryPayProcessed: false, deliveryEarned: 0,
                    cancelledAt: serverTimestamp()
                });
            });
        }

        // ---------- ট্রানজ্যাকশন: হেলপারের কমিশন + ডেলিভারি ম্যানের আয় (একই অর্ডারে দুইবার হবে না) ----------
        async function settleCommission(id) {
            const orderRef = doc(db, "orders", id);
            return runTransaction(db, async (tx) => {
                const oSnap = await tx.get(orderRef);
                if (!oSnap.exists()) return;
                const o = oSnap.data();
                if (o.status !== "delivered") return;

                const helperDue = !!o.helperId && !o.commissionProcessed;
                const manDue = !!o.deliveryManId && !o.deliveryPayProcessed;
                if (!helperDue && !manDue) return;

                const hRef = helperDue ? doc(db, "users", o.helperId) : null;
                const mRef = manDue ? doc(db, "users", o.deliveryManId) : null;
                const hSnap = hRef ? await tx.get(hRef) : null;
                const mSnap = mRef ? await tx.get(mRef) : null;

                const upd = {};
                if (hSnap && hSnap.exists()) {
                    // হেলপারের কমিশন: পণ্যের দামের উপর (ডেলিভারি চার্জ বাদে)
                    const rate = Number(o.helperCommissionRate) || 0;
                    const amt = Math.round((Number(o.subtotal) || 0) * rate / 100);
                    tx.update(hRef, { walletBalance: increment(amt), totalEarned: increment(amt) });
                    upd.commissionProcessed = true;
                    upd.earnedCommission = amt;
                }
                if (mSnap && mSnap.exists()) {
                    // ডেলিভারি ম্যানের আয়: ডেলিভারি চার্জের নির্ধারিত %
                    const rate = Number(o.deliveryManRate) || 0;
                    const amt = Math.round((Number(o.deliveryCharge) || 0) * rate / 100);
                    tx.update(mRef, { walletBalance: increment(amt), totalEarned: increment(amt) });
                    upd.deliveryPayProcessed = true;
                    upd.deliveryEarned = amt;
                }
                if (Object.keys(upd).length) tx.update(orderRef, upd);
            });
        }

        // ---------- বাটন চালানোর সাহায্যকারী ----------
        async function act(btn, fn) {
            if (btn.disabled) return;
            const old = btn.textContent;
            btn.disabled = true;
            btn.textContent = "...";
            try { await fn(); }
            catch (e) { console.error(e); alert(e.message || e.code || "সমস্যা হয়েছে"); }
            finally { btn.disabled = false; btn.textContent = old; }
        }

        // ---------- দেখানো ----------
        function renderTabs() {
            const box = $("tabs");
            box.innerHTML = "";
            Object.entries(STATUS).forEach(([key, s]) => {
                const n = orders.filter(o => o.status === key).length;
                box.append(h("button", {
                    class: "shrink-0 px-4 py-2 rounded-2xl text-xs font-bold " +
                        (key === activeTab ? "bg-white text-green-700" : "bg-green-800 text-white"),
                    text: `${s.label} (${n.toLocaleString("bn-BD")})`,
                    onclick: () => { activeTab = key; render(); }
                }));
            });
        }

        function render() {
            renderTabs();
            const term = $("search").value.trim().toLowerCase();
            const list = orders.filter(o => o.status === activeTab && (!term ||
                (o.customerName || "").toLowerCase().includes(term) ||
                (o.customerPhone || "").includes(term) ||
                o.id.toLowerCase().startsWith(term)));
            const box = $("list");
            box.innerHTML = "";
            if (!list.length) {
                box.append(h("p", { class: "text-center text-slate-400 py-12", text: "কোনো অর্ডার নেই" }));
                return;
            }
            list.forEach(o => box.append(orderCard(o)));
        }

        function orderCard(o) {
            const st = STATUS[o.status] || { label: o.status, cls: "bg-slate-100" };
            const when = o.createdAt?.toDate ? o.createdAt.toDate().toLocaleString("bn-BD") : "";

            const items = (o.items || []).map(i =>
                h("div", { class: "flex justify-between text-xs" },
                    h("span", { text: `${i.name} × ${i.qty}` }),
                    h("span", { text: taka((i.price || 0) * (i.qty || 0)) })));

            const info = [];
            if (o.helperId) info.push(h("p", { class: "text-[11px] text-orange-600", text: `হেলপার: ${o.helperName || "—"} (কমিশন ${o.helperCommissionRate || 0}%)` + (o.commissionProcessed ? ` ✔ ${taka(o.earnedCommission)} যোগ হয়েছে` : "") }));

            // ডেলিভারি ম্যান বাছাই (কনফার্মের সময়ই বাছতে হবে; পরে বদলানোও যাবে)
            let deliverySel = null;
            let chosen = o.deliveryManId || pendingChoice[o.id] || "";
            const needsMan = o.deliveryMethod !== "shop";
            if (needsMan && (o.status === "pending" || o.status === "confirmed" || o.status === "shipping")) {
                const first = !deliveryMen.length
                    ? "কোনো ডেলিভারি ম্যান নেই, আগে একাউন্ট বানান"
                    : (o.status === "pending" ? "— কোন ডেলিভারি ম্যান দেবেন? —" : "— ডেলিভারি ম্যান বাছুন —");
                deliverySel = h("select", { class: "w-full p-3 border rounded-xl text-sm bg-white " + (o.status === "pending" ? "border-orange-300" : "") },
                    h("option", { value: "", text: first }),
                    deliveryMen.map(d => h("option", { value: d.id, text: d.name, ...(chosen === d.id ? { selected: "selected" } : {}) })));
                deliverySel.addEventListener("change", async () => {
                    chosen = deliverySel.value;
                    if (o.status === "pending") { pendingChoice[o.id] = chosen; return; } // কনফার্মের সময় একসাথে সেভ হবে
                    const man = deliveryMen.find(d => d.id === chosen);
                    try {
                        await updateDoc(doc(db, "orders", o.id), {
                            deliveryManId: man ? man.id : null,
                            deliveryManName: man ? man.name : null,
                            deliveryManRate: man ? (Number(man.rate) || 0) : 0
                        });
                    } catch (e) { alert("সমস্যা: " + (e.code || e.message)); }
                });
            } else if (o.deliveryManName) {
                info.push(h("p", { class: "text-[11px] text-slate-500", text: "ডেলিভারি: " + o.deliveryManName + (o.deliveryPayProcessed ? ` ✔ আয় ${taka(o.deliveryEarned)} যোগ হয়েছে` : "") }));
            }

            // বাটন
            const btns = [];
            const mk = (text, cls, fn) => {
                const b = h("button", { class: `flex-1 py-2.5 rounded-xl text-xs font-bold active:scale-95 transition disabled:opacity-60 ${cls}`, text });
                b.addEventListener("click", () => act(b, fn));
                return b;
            };
            if (o.status === "pending") {
                btns.push(mk("✔ কনফার্ম", "bg-green-600 text-white", async () => {
                    const man = deliveryMen.find(d => d.id === chosen) || null;
                    if (o.deliveryMethod !== "shop" && !man) { alert("আগে নিচের তালিকা থেকে ডেলিভারি ম্যান বাছুন।"); return; }
                    const r = await confirmOrder(o.id, man);
                    if (r.before !== r.after) alert(`বর্তমান দামে হিসাব করে মোট বিল ${taka(r.before)} থেকে ${taka(r.after)} হয়েছে।`);
                }));
                btns.push(mk("বাতিল", "bg-red-50 text-red-600", async () => {
                    if (confirm("অর্ডারটি বাতিল করবেন?")) await cancelOrder(o.id);
                }));
            } else if (o.status === "confirmed" || o.status === "shipping") {
                btns.push(mk("📦 ডেলিভারি হয়েছে", "bg-green-600 text-white", async () => {
                    if (confirm("ডেলিভারি সম্পন্ন হয়েছে বলে চিহ্নিত করবেন? এরপর হেলপারের কমিশন যোগ হবে।"))
                        await updateDoc(doc(db, "orders", o.id), { status: "delivered", deliveredAt: serverTimestamp() });
                }));
                btns.push(mk("বাতিল", "bg-red-50 text-red-600", async () => {
                    if (confirm("অর্ডারটি বাতিল করবেন? স্টক ফেরত আসবে।")) await cancelOrder(o.id);
                }));
            } else if (o.status === "delivered") {
                btns.push(mk("↩ রিটার্ন / বাতিল", "bg-red-50 text-red-600", async () => {
                    if (confirm("ডেলিভারি হওয়া অর্ডার বাতিল করবেন? স্টক ফেরত আসবে এবং হেলপারের কমিশন কাটা যাবে।")) await cancelOrder(o.id);
                }));
            } else if (o.status === "cancelled") {
                btns.push(mk("🗑 মুছে ফেলুন", "bg-slate-100 text-slate-600", async () => {
                    if (confirm("চিরতরে মুছে ফেলবেন?")) await deleteDoc(doc(db, "orders", o.id));
                }));
            }

            return h("div", { class: "bg-white rounded-3xl shadow-sm p-4 space-y-2" },
                h("div", { class: "flex justify-between items-start gap-2" },
                    h("div", {},
                        h("p", { class: "font-bold text-slate-800", text: o.customerName || "(নাম নেই)" }),
                        h("a", { href: "tel:" + (o.customerPhone || ""), class: "text-sm text-blue-600 font-bold", text: "📞 " + (o.customerPhone || "") })),
                    h("div", { class: "text-right" },
                        h("span", { class: `text-[10px] font-bold px-2 py-1 rounded-full ${st.cls}`, text: st.label }),
                        h("p", { class: "text-[10px] text-slate-400 mt-1", text: "#" + o.id.slice(0, 8).toUpperCase() }))),
                h("p", { class: "text-xs text-slate-600", text: (o.deliveryMethod === "shop" ? "🏪 " : "📍 ") + (o.customerAddress || "") }),
                h("p", { class: "text-[10px] text-slate-400", text: when }),
                h("div", { class: "bg-slate-50 rounded-xl p-3 space-y-1" }, items,
                    h("div", { class: "flex justify-between text-xs text-slate-500 border-t pt-1" }, h("span", { text: "ডেলিভারি চার্জ" }), h("span", { text: taka(o.deliveryCharge) })),
                    h("div", { class: "flex justify-between text-sm font-bold text-green-700" }, h("span", { text: "মোট" }), h("span", { text: taka(o.totalBill) }))),
                info, deliverySel,
                h("div", { class: "flex gap-2 pt-1" }, btns));
        }

        $("search").addEventListener("input", render);
    </script>
</body>
</html>
