<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ইউজার ম্যানেজ | আপন হাট</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap">
    <style>body { font-family: 'Hind Siliguri', sans-serif; }</style>
</head>
<body style="display:none" class="bg-slate-100 min-h-screen pb-10">
    <header class="bg-green-700 text-white p-4 flex items-center gap-3">
        <a href="owner-dashboard.html" class="text-xl">←</a>
        <h1 class="font-bold text-lg">হেলপার ও ডেলিভারি ম্যান</h1>
    </header>

    <main class="max-w-lg mx-auto p-4 space-y-5">
        <form id="user-form" class="bg-white rounded-3xl shadow p-5 space-y-3">
            <h2 class="font-bold text-slate-700">নতুন একাউন্ট তৈরি</h2>
            <input id="u-name" required maxlength="80" placeholder="পুরো নাম" class="w-full p-3 border rounded-xl">
            <input id="u-phone" required maxlength="20" inputmode="tel" placeholder="ফোন নম্বর" class="w-full p-3 border rounded-xl">
            <input id="u-email" type="email" required placeholder="ইমেইল (লগইনের জন্য)" class="w-full p-3 border rounded-xl">
            <input id="u-pass" type="password" required minlength="6" autocomplete="new-password" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)" class="w-full p-3 border rounded-xl">
            <select id="u-role" class="w-full p-3 border rounded-xl bg-white">
                <option value="helper">হেলপার (অর্ডার নেবে, কমিশন পাবে)</option>
                <option value="delivery">ডেলিভারি ম্যান</option>
            </select>
            <div id="rate-box">
                <label id="rate-label" class="text-xs font-bold text-slate-500">কমিশন রেট (%) — পণ্যের দামের উপর</label>
                <input id="u-rate" type="number" min="0" max="100" step="any" value="2" class="w-full p-3 border rounded-xl">
            </div>
            <button id="create-btn" type="submit" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold active:scale-95 transition disabled:opacity-60">একাউন্ট তৈরি করুন</button>
            <p id="msg" class="text-center text-sm font-bold"></p>
        </form>

        <section>
            <h2 class="font-bold text-slate-700 mb-2">সব ইউজার</h2>
            <div id="user-list" class="space-y-3"></div>
        </section>
    </main>

    <script type="module">
        import { db, firebaseConfig } from "./firebase-config.js";
        import { requireRole } from "./auth-guard.js";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signOut }
            from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { collection, doc, getDocs, setDoc, updateDoc, serverTimestamp }
            from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        await requireRole(['owner']);

        // দ্বিতীয় অ্যাপ: নতুন একাউন্ট বানালে মালিক লগআউট হবে না
        const secondaryApp = initializeApp(firebaseConfig, "secondary");
        const secondaryAuth = getAuth(secondaryApp);

        const $ = (id) => document.getElementById(id);
        const ROLE_LABEL = { owner: "মালিক", helper: "হেলপার", delivery: "ডেলিভারি ম্যান" };

        function updateRateUI() {
            const isHelper = $('u-role').value === 'helper';
            $('rate-label').textContent = isHelper
                ? "কমিশন রেট (%) — অর্ডারের পণ্যের দামের উপর"
                : "ডেলিভারি চার্জের কত % পাবে (%)";
            $('u-rate').value = isHelper ? 2 : 50;
        }
        $('u-role').addEventListener('change', updateRateUI);

        async function loadUsers() {
            const list = $('user-list');
            list.innerHTML = "";
            const snap = await getDocs(collection(db, "users"));
            if (snap.empty) { list.textContent = "কোনো ইউজার নেই"; return; }

            snap.docs.forEach(d => {
                const u = d.data();
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm p-4 flex justify-between items-center gap-3";

                const info = document.createElement('div');
                const name = document.createElement('p');
                name.className = "font-bold text-slate-800";
                name.textContent = u.name || "(নাম নেই)";
                const meta = document.createElement('p');
                meta.className = "text-xs text-slate-500";
                let text = `${ROLE_LABEL[u.role] || u.role} • ${u.phone || ""}`;
                if (u.role === 'helper') text += ` • কমিশন ${u.commissionRate ?? 0}% • ওয়ালেট ৳${u.walletBalance ?? 0}`;
                if (u.role === 'delivery') text += ` • ডেলিভারি আয় ${u.deliveryCommissionRate ?? 0}% • ওয়ালেট ৳${u.walletBalance ?? 0}`;
                meta.textContent = text;
                const mail = document.createElement('p');
                mail.className = "text-[11px] text-slate-400";
                mail.textContent = u.email || "";
                info.append(name, meta, mail);
                card.appendChild(info);

                if (u.role === 'helper' || u.role === 'delivery') {
                    const rateField = u.role === 'helper' ? 'commissionRate' : 'deliveryCommissionRate';
                    const curRate = u[rateField] ?? 0;
                    const btn = document.createElement('button');
                    btn.className = "text-xs bg-blue-50 text-blue-600 px-3 py-2 rounded-xl font-bold shrink-0";
                    btn.textContent = u.role === 'helper' ? "কমিশন বদলান" : "আয়ের % বদলান";
                    btn.onclick = async () => {
                        const v = prompt(u.role === 'helper' ? "নতুন কমিশন রেট (%)" : "ডেলিভারি চার্জের নতুন % (যেমন ৫০)", curRate);
                        if (v === null) return;
                        const rate = Number(v);
                        if (!(rate >= 0 && rate <= 100)) return alert("০ থেকে ১০০ এর মধ্যে সংখ্যা দিন");
                        try {
                            await updateDoc(doc(db, "users", d.id), { [rateField]: rate });
                            loadUsers();
                        } catch (err) { alert("সমস্যা: " + (err.code || err.message)); }
                    };
                    card.appendChild(btn);
                }
                list.appendChild(card);
            });
        }

        let creating = false;
        $('user-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (creating) return;
            if (!confirm("এই একাউন্টটি তৈরি করতে চান?")) return;

            creating = true;
            const btn = $('create-btn');
            btn.disabled = true;
            btn.textContent = "তৈরি হচ্ছে...";
            $('msg').textContent = "";

            const role = $('u-role').value;
            const email = $('u-email').value.trim();

            try {
                const cred = await createUserWithEmailAndPassword(secondaryAuth, email, $('u-pass').value);
                try {
                    // মালিকের নিজের লগইন দিয়ে প্রোফাইল সেভ হচ্ছে (রুলস অনুযায়ী)
                    await setDoc(doc(db, "users", cred.user.uid), {
                        name: $('u-name').value.trim(),
                        email,
                        phone: $('u-phone').value.trim(),
                        role,
                        commissionRate: role === 'helper' ? (Number($('u-rate').value) || 0) : 0,
                        deliveryCommissionRate: role === 'delivery' ? (Number($('u-rate').value) || 0) : 0,
                        walletBalance: 0,
                        totalEarned: 0,
                        createdAt: serverTimestamp()
                    });
                } catch (dbErr) {
                    throw new Error("লগইন একাউন্ট তৈরি হয়েছে, কিন্তু প্রোফাইল সেভ হয়নি (" + (dbErr.code || dbErr.message) + "). Firestore Rules চেক করুন।");
                } finally {
                    await signOut(secondaryAuth);
                }
                $('msg').className = "text-center text-sm font-bold text-green-600";
                $('msg').textContent = "একাউন্ট তৈরি হয়েছে!";
                $('user-form').reset();
                updateRateUI();
                loadUsers();
            } catch (err) {
                console.error(err);
                $('msg').className = "text-center text-sm font-bold text-red-600";
                $('msg').textContent = err.code === "auth/email-already-in-use"
                    ? "এই ইমেইল আগে থেকেই ব্যবহার হয়েছে"
                    : err.code === "auth/weak-password" ? "পাসওয়ার্ড আরও শক্ত দিন"
                    : (err.message || "সমস্যা হয়েছে");
            } finally {
                creating = false;
                btn.disabled = false;
                btn.textContent = "একাউন্ট তৈরি করুন";
            }
        });

        loadUsers();
    </script>
</body>
</html>
