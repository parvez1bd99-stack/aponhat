<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ডেলিভারি চার্জ | আপন হাট</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap">
    <style>body { font-family: 'Hind Siliguri', sans-serif; }</style>
</head>
<body style="display:none" class="bg-slate-100 min-h-screen pb-10">
    <header class="bg-green-700 text-white p-4 flex items-center gap-3">
        <a href="owner-dashboard.html" class="text-xl">←</a>
        <h1 class="font-bold text-lg">ডেলিভারি চার্জ সেটিং</h1>
    </header>

    <main class="max-w-lg mx-auto p-4 space-y-4">
        <div class="bg-white rounded-3xl shadow-sm p-5 space-y-3">
            <p class="text-xs text-slate-500 leading-relaxed">
                অর্ডারের মোট ওজন অনুযায়ী চার্জ নির্ধারণ হবে। যেমন "২ কেজি পর্যন্ত → ৳৩০"।
                অর্ডারের ওজন সবচেয়ে বড় সীমার চেয়েও বেশি হলে শেষ নিয়মের চার্জই প্রযোজ্য হবে।
            </p>
            <div id="rows" class="space-y-2"></div>
            <button id="add-row" type="button" class="w-full bg-blue-50 text-blue-600 py-2.5 rounded-xl text-sm font-bold">➕ নতুন সীমা যোগ করুন</button>
            <button id="save" type="button" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold active:scale-95 transition disabled:opacity-60">সেভ করুন</button>
            <p id="msg" class="text-center text-sm font-bold"></p>
        </div>
        <div class="bg-white rounded-3xl shadow-sm p-5 space-y-3">
            <h2 class="font-bold text-slate-700">📦 পণ্য নেওয়ার স্থান (ডেলিভারি ম্যান দেখবে)</h2>
            <input id="shop-name" maxlength="80" placeholder="দোকান/গুদামের নাম" class="w-full p-3 border rounded-xl">
            <textarea id="shop-address" rows="2" maxlength="250" placeholder="ঠিকানা (কোথা থেকে পণ্য রিসিভ করবে)" class="w-full p-3 border rounded-xl"></textarea>
            <input id="shop-phone" inputmode="tel" maxlength="20" placeholder="যোগাযোগের ফোন নম্বর" class="w-full p-3 border rounded-xl">
            <button id="save-shop" type="button" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold active:scale-95 transition disabled:opacity-60">ঠিকানা সেভ করুন</button>
            <p id="shop-msg" class="text-center text-sm font-bold"></p>
        </div>
        <p class="text-[11px] text-slate-400 text-center">শপ থেকে পিকআপ নিলে ডেলিভারি চার্জ সবসময় ০।</p>
    </main>

    <script type="module">
        import { db } from "./firebase-config.js";
        import { requireRole } from "./auth-guard.js";
        import { doc, getDoc, setDoc, serverTimestamp }
            from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        await requireRole(['owner']);

        const $ = (id) => document.getElementById(id);
        const ref = doc(db, "settings", "delivery");

        function addRow(maxW = "", charge = "") {
            const row = document.createElement("div");
            row.className = "flex items-center gap-2";
            row.innerHTML = `
                <div class="flex-1"><label class="text-[10px] text-slate-400">ওজন (কেজি) পর্যন্ত</label>
                    <input type="number" min="0" step="any" class="r-w w-full p-2.5 border rounded-xl"></div>
                <div class="flex-1"><label class="text-[10px] text-slate-400">চার্জ (৳)</label>
                    <input type="number" min="0" step="any" class="r-c w-full p-2.5 border rounded-xl"></div>
                <button type="button" class="r-del mt-4 bg-red-50 text-red-500 w-10 h-10 rounded-xl">🗑</button>`;
            row.querySelector(".r-w").value = maxW;
            row.querySelector(".r-c").value = charge;
            row.querySelector(".r-del").onclick = () => row.remove();
            $("rows").appendChild(row);
        }

        try {
            const s = await getDoc(ref);
            const rules = s.exists() && Array.isArray(s.data().rules) ? s.data().rules : [];
            if (rules.length) rules.forEach(r => addRow(r.maxW, r.charge));
            else { addRow(2, 30); addRow(5, 50); addRow(10, 80); }
        } catch (e) {
            console.error(e);
            $("msg").className = "text-center text-sm font-bold text-red-600";
            $("msg").textContent = "লোড হয়নি: " + (e.code || e.message);
        }

        $("add-row").onclick = () => addRow();

        // ---------- পণ্য নেওয়ার স্থান ----------
        const shopRef = doc(db, "settings", "shop");
        try {
            const sh = await getDoc(shopRef);
            if (sh.exists()) {
                $("shop-name").value = sh.data().name || "";
                $("shop-address").value = sh.data().address || "";
                $("shop-phone").value = sh.data().phone || "";
            }
        } catch (e) { console.error(e); }

        $("save-shop").onclick = async () => {
            const m = $("shop-msg");
            const setM = (t, ok) => { m.textContent = t; m.className = "text-center text-sm font-bold " + (ok ? "text-green-600" : "text-red-600"); };
            const address = $("shop-address").value.trim();
            if (address.length < 5) return setM("ঠিকানা লিখুন");
            const b = $("save-shop");
            b.disabled = true;
            try {
                await setDoc(shopRef, {
                    name: $("shop-name").value.trim(),
                    address,
                    phone: $("shop-phone").value.trim(),
                    updatedAt: serverTimestamp()
                });
                setM("সেভ হয়েছে!", true);
            } catch (e) { console.error(e); setM("সেভ হয়নি: " + (e.code || e.message)); }
            finally { b.disabled = false; }
        };

        $("save").onclick = async () => {
            const msg = $("msg");
            const setMsg = (t, ok) => { msg.textContent = t; msg.className = "text-center text-sm font-bold " + (ok ? "text-green-600" : "text-red-600"); };

            const rules = [...document.querySelectorAll("#rows > div")].map(r => ({
                maxW: Number(r.querySelector(".r-w").value),
                charge: Number(r.querySelector(".r-c").value),
                blank: r.querySelector(".r-w").value === "" || r.querySelector(".r-c").value === ""
            }));
            if (!rules.length) return setMsg("কমপক্ষে একটি নিয়ম দিন");
            if (rules.some(r => r.blank || r.maxW <= 0 || r.charge < 0)) return setMsg("ওজন ০ এর বেশি ও চার্জ ঋণাত্মক নয়, এমন সংখ্যা দিন");
            const ws = rules.map(r => r.maxW);
            if (new Set(ws).size !== ws.length) return setMsg("একই ওজনের সীমা দুইবার দেওয়া যাবে না");

            const clean = rules.map(({ maxW, charge }) => ({ maxW, charge })).sort((a, b) => a.maxW - b.maxW);
            const btn = $("save");
            btn.disabled = true;
            try {
                await setDoc(ref, { rules: clean, updatedAt: serverTimestamp() });
                setMsg("সেভ হয়েছে!", true);
            } catch (e) {
                console.error(e);
                setMsg("সেভ হয়নি: " + (e.code || e.message));
            } finally { btn.disabled = false; }
        };
    </script>
</body>
</html>
