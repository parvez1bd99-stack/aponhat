<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হেলপার ড্যাশবোর্ড | আপন হাট</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap">
    <style>body { font-family: 'Hind Siliguri', sans-serif; }</style>
</head>
<body style="display:none" class="bg-slate-100 min-h-screen pb-10">
    <header class="bg-green-700 text-white p-4 flex justify-between items-center">
        <div>
            <h1 class="font-bold text-lg">হেলপার ড্যাশবোর্ড</h1>
            <p id="who" class="text-xs opacity-80"></p>
        </div>
        <button id="logout-btn" class="text-xs bg-red-500 px-3 py-2 rounded-xl font-bold">লগআউট</button>
    </header>

    <main class="max-w-lg mx-auto p-4 space-y-4">
        <!-- ওয়ালেট -->
        <section class="bg-gradient-to-br from-green-600 to-green-800 text-white rounded-3xl p-5 shadow">
            <p class="text-xs opacity-80">ওয়ালেট ব্যালেন্স</p>
            <p id="balance" class="text-4xl font-black mt-1">৳০</p>
            <div class="flex justify-between text-xs mt-3 opacity-90">
                <span>মোট আয়: <b id="earned">৳০</b></span>
                <span>কমিশন রেট: <b id="rate">০%</b></span>
            </div>
            <button id="toggle-withdraw" class="mt-4 w-full bg-white text-green-700 py-2.5 rounded-xl font-bold text-sm active:scale-95 transition">💸 টাকা তুলুন (বিকাশ)</button>
        </section>

        <!-- উইথড্র ফর্ম -->
        <form id="withdraw-form" class="hidden bg-white rounded-3xl shadow-sm p-4 space-y-3">
            <h2 class="font-bold text-slate-700">উইথড্র আবেদন</h2>
            <input id="w-amount" type="number" min="1" step="1" required placeholder="কত টাকা তুলবেন?" class="w-full p-3 border rounded-xl">
            <input id="w-bkash" inputmode="tel" maxlength="11" required placeholder="বিকাশ নম্বর (01XXXXXXXXX)" class="w-full p-3 border rounded-xl">
            <p class="text-[11px] text-slate-400">সর্বনিম্ন <span id="min-w"></span> টাকা। মালিক যাচাই করে বিকাশে পাঠাবেন।</p>
            <button id="w-btn" type="submit" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold disabled:opacity-60">আবেদন পাঠান</button>
            <p id="w-msg" class="text-center text-sm font-bold"></p>
        </form>

        <a href="index.html" class="block bg-orange-500 text-white text-center py-3.5 rounded-2xl font-bold shadow active:scale-95 transition">🛒 নতুন অর্ডার নিন</a>

        <!-- উইথড্র ইতিহাস -->
        <section>
            <h2 class="font-bold text-slate-700 mb-2">উইথড্র আবেদন</h2>
            <div id="w-list" class="space-y-2"></div>
        </section>

        <!-- আমার অর্ডার -->
        <section>
            <h2 class="font-bold text-slate-700 mb-2">আমার নেওয়া অর্ডার</h2>
            <div id="o-list" class="space-y-2"></div>
        </section>
    </main>

    <script type="module">
        import { db } from "./firebase-config.js";
        import { requireRole, logout } from "./auth-guard.js";
        import { collection, doc, query, where, onSnapshot, addDoc, serverTimestamp }
            from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const MIN_WITHDRAW = 100; // সর্বনিম্ন উইথড্র (টাকা), চাইলে বদলান

        const { user, profile } = await requireRole(['helper']);
        const $ = (id) => document.getElementById(id);
        const taka = (n) => "৳" + Number(n || 0).toLocaleString("bn-BD");

        function h(tag, props = {}, ...kids) {
            const e = document.createElement(tag);
            for (const [k, v] of Object.entries(props)) {
                if (k === "class") e.className = v;
                else if (k === "text") e.textContent = v;
                else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
                else if (v !== undefined && v !== null) e.setAttribute(k, v);
            }
            for (const kid of kids.flat()) if (kid != null) e.append(kid);
            return e;
        }

        let me = profile;
        let withdraws = [];
        $("who").textContent = me.name || me.email || "";
        $("logout-btn").onclick = logout;
        $("min-w").textContent = MIN_WITHDRAW.toLocaleString("bn-BD");

        // ---------- ওয়ালেট (লাইভ) ----------
        onSnapshot(doc(db, "users", user.uid), (s) => {
            if (!s.exists()) return;
            me = { id: s.id, ...s.data() };
            $("balance").textContent = taka(me.walletBalance);
            $("earned").textContent = taka(me.totalEarned);
            $("rate").textContent = (Number(me.commissionRate) || 0).toLocaleString("bn-BD") + "%";
        });

        $("toggle-withdraw").onclick = () => $("withdraw-form").classList.toggle("hidden");

        // ---------- উইথড্র তালিকা ----------
        const WSTAT = {
            pending:  { t: "অপেক্ষমাণ", c: "bg-orange-100 text-orange-700" },
            paid:     { t: "পাঠানো হয়েছে", c: "bg-green-100 text-green-700" },
            rejected: { t: "বাতিল", c: "bg-red-100 text-red-700" }
        };
        onSnapshot(query(collection(db, "withdraw_requests"), where("helperId", "==", user.uid)), (snap) => {
            withdraws = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
            const box = $("w-list");
            box.innerHTML = "";
            if (!withdraws.length) box.append(h("p", { class: "text-center text-slate-400 text-sm py-4", text: "কোনো আবেদন নেই" }));
            withdraws.forEach(w => {
                const st = WSTAT[w.status] || { t: w.status, c: "bg-slate-100" };
                box.append(h("div", { class: "bg-white rounded-2xl shadow-sm p-3 flex justify-between items-center" },
                    h("div", {},
                        h("p", { class: "font-bold text-slate-800", text: taka(w.amount) }),
                        h("p", { class: "text-[11px] text-slate-400", text: `বিকাশ ${w.bkashNumber || ""} • ${w.createdAt?.toDate ? w.createdAt.toDate().toLocaleDateString("bn-BD") : ""}` })),
                    h("span", { class: `text-[10px] font-bold px-2 py-1 rounded-full ${st.c}`, text: st.t })));
            });
        }, (e) => console.error(e));

        let sending = false;
        $("withdraw-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            if (sending) return;
            const msg = $("w-msg");
            const setMsg = (t, ok) => { msg.textContent = t; msg.className = "text-center text-sm font-bold " + (ok ? "text-green-600" : "text-red-600"); };
            const amount = Number($("w-amount").value);
            const bkash = $("w-bkash").value.replace(/\s/g, "");

            if (!Number.isInteger(amount) || amount < MIN_WITHDRAW) return setMsg(`সর্বনিম্ন ${MIN_WITHDRAW} টাকা তুলতে পারবেন`);
            if (amount > (Number(me.walletBalance) || 0)) return setMsg("ওয়ালেটে এত টাকা নেই");
            if (!/^01[3-9]\d{8}$/.test(bkash)) return setMsg("সঠিক ১১ ডিজিটের বিকাশ নম্বর দিন");
            if (withdraws.some(w => w.status === "pending")) return setMsg("আগের আবেদনটি এখনো অপেক্ষমাণ আছে");

            sending = true;
            $("w-btn").disabled = true;
            try {
                await addDoc(collection(db, "withdraw_requests"), {
                    helperId: user.uid,
                    helperName: me.name || "",
                    bkashNumber: bkash,
                    amount,
                    requesterRole: "helper",
                    status: "pending",
                    createdAt: serverTimestamp()
                });
                setMsg("আবেদন পাঠানো হয়েছে!", true);
                $("withdraw-form").reset();
            } catch (err) {
                console.error(err);
                setMsg("আবেদন যায়নি: " + (err.code || err.message));
            } finally {
                sending = false;
                $("w-btn").disabled = false;
            }
        });

        // ---------- আমার অর্ডার ----------
        const OSTAT = {
            pending:   { t: "নতুন", c: "bg-orange-100 text-orange-700" },
            confirmed: { t: "কনফার্মড", c: "bg-blue-100 text-blue-700" },
            shipping:  { t: "পথে", c: "bg-purple-100 text-purple-700" },
            delivered: { t: "ডেলিভার্ড", c: "bg-green-100 text-green-700" },
            cancelled: { t: "বাতিল", c: "bg-red-100 text-red-700" }
        };
        onSnapshot(query(collection(db, "orders"), where("helperId", "==", user.uid)), (snap) => {
            const orders = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0))
                .slice(0, 100);
            const box = $("o-list");
            box.innerHTML = "";
            if (!orders.length) box.append(h("p", { class: "text-center text-slate-400 text-sm py-4", text: "এখনো কোনো অর্ডার নেননি" }));
            orders.forEach(o => {
                const st = OSTAT[o.status] || { t: o.status, c: "bg-slate-100" };
                let com;
                if (o.status === "cancelled") com = "কমিশন নেই";
                else if (o.status === "delivered" && o.commissionProcessed) com = `কমিশন +${taka(o.earnedCommission)} ✔`;
                else if (o.status === "delivered") com = "কমিশন যোগ হচ্ছে...";
                else com = `সম্ভাব্য কমিশন ${taka(Math.round((Number(o.subtotal) || 0) * (Number(o.helperCommissionRate) || 0) / 100))}`;

                box.append(h("div", { class: "bg-white rounded-2xl shadow-sm p-3 space-y-1" },
                    h("div", { class: "flex justify-between items-start" },
                        h("div", {},
                            h("p", { class: "font-bold text-slate-800 text-sm", text: o.customerName || "" }),
                            h("p", { class: "text-[11px] text-slate-400", text: (o.createdAt?.toDate ? o.createdAt.toDate().toLocaleString("bn-BD") : "") + " • #" + o.id.slice(0, 6).toUpperCase() })),
                        h("span", { class: `text-[10px] font-bold px-2 py-1 rounded-full ${st.c}`, text: st.t })),
                    h("div", { class: "flex justify-between text-xs" },
                        h("span", { class: "text-slate-600", text: "মোট বিল " + taka(o.totalBill) }),
                        h("span", { class: "text-green-700 font-bold", text: com }))));
            });
        }, (e) => console.error(e));
    </script>
</body>
</html>
