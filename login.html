<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন | আপন হাট</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap">
    <style>body { font-family: 'Hind Siliguri', sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white rounded-3xl shadow-lg p-8">
        <h1 class="text-2xl font-bold text-green-700 text-center mb-1">আপন হাট</h1>
        <p class="text-center text-slate-400 text-sm mb-6">মালিক, হেলপার ও ডেলিভারি ম্যান লগইন</p>

        <form id="login-form" class="space-y-4">
            <input id="email" type="email" required autocomplete="username" placeholder="ইমেইল"
                class="w-full p-3 border rounded-xl outline-none focus:border-green-600">
            <input id="password" type="password" required autocomplete="current-password" placeholder="পাসওয়ার্ড"
                class="w-full p-3 border rounded-xl outline-none focus:border-green-600">
            <p id="msg" class="text-sm text-red-600 text-center min-h-[1.25rem]"></p>
            <button id="login-btn" type="submit"
                class="w-full bg-green-600 text-white py-3 rounded-xl font-bold active:scale-95 transition disabled:opacity-60">
                লগইন
            </button>
        </form>

        <a href="index.html" class="block text-center text-xs text-slate-400 mt-6">← দোকানে ফিরে যান</a>
    </div>

    <script type="module">
        import { auth } from "./firebase-config.js";
        import { signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getProfile, ROLE_HOME } from "./auth-guard.js";

        const form = document.getElementById('login-form');
        const btn = document.getElementById('login-btn');
        const msg = document.getElementById('msg');
        let busy = false;

        async function goHome(user) {
            const profile = await getProfile(user.uid);
            if (!profile || !ROLE_HOME[profile.role]) {
                await signOut(auth);
                throw new Error("NO_PROFILE");
            }
            location.replace(ROLE_HOME[profile.role]);
        }

        // আগে থেকেই লগইন থাকলে সরাসরি নিজের পেজে পাঠাবে
        onAuthStateChanged(auth, (user) => {
            if (user && !busy) goHome(user).catch(() => {});
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (busy) return;
            busy = true;
            msg.textContent = "";
            btn.disabled = true;
            btn.textContent = "চেক করা হচ্ছে...";

            try {
                const cred = await signInWithEmailAndPassword(
                    auth,
                    document.getElementById('email').value.trim(),
                    document.getElementById('password').value
                );
                await goHome(cred.user);
            } catch (err) {
                console.error(err);
                if (err.message === "NO_PROFILE") {
                    msg.textContent = "এই একাউন্টের কোনো রোল সেট করা নেই। মালিকের সাথে যোগাযোগ করুন।";
                } else if (err.code === "auth/invalid-credential" || err.code === "auth/wrong-password" || err.code === "auth/user-not-found") {
                    msg.textContent = "ইমেইল বা পাসওয়ার্ড ভুল!";
                } else if (err.code === "auth/too-many-requests") {
                    msg.textContent = "অনেকবার ভুল হয়েছে, কিছুক্ষণ পর চেষ্টা করুন।";
                } else if (err.code === "auth/network-request-failed") {
                    msg.textContent = "ইন্টারনেট সংযোগ চেক করুন।";
                } else {
                    msg.textContent = "সমস্যা হয়েছে: " + (err.code || err.message);
                }
            } finally {
                busy = false;
                btn.disabled = false;
                btn.textContent = "লগইন";
            }
        });
    </script>
</body>
</html>
