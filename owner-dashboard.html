<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মালিকের ড্যাশবোর্ড | আপন হাট</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap">
    <style>body { font-family: 'Hind Siliguri', sans-serif; }</style>
</head>
<body style="display:none" class="bg-slate-100 min-h-screen pb-10">
    <header class="bg-green-700 text-white p-4 flex justify-between items-center">
        <div>
            <h1 class="font-bold text-lg">মালিকের ড্যাশবোর্ড</h1>
            <p id="who" class="text-xs opacity-80"></p>
        </div>
        <button id="logout-btn" class="text-xs bg-red-500 px-3 py-2 rounded-xl font-bold">লগআউট</button>
    </header>

    <main class="max-w-lg mx-auto p-4 space-y-4">
        <div class="grid grid-cols-3 gap-3 text-center">
            <div class="bg-white rounded-2xl shadow-sm p-3">
                <p id="c-orders" class="text-2xl font-black text-orange-500">-</p>
                <p class="text-[11px] text-slate-500">নতুন অর্ডার</p>
            </div>
            <div class="bg-white rounded-2xl shadow-sm p-3">
                <p id="c-withdraw" class="text-2xl font-black text-blue-600">-</p>
                <p class="text-[11px] text-slate-500">উইথড্র আবেদন</p>
            </div>
            <div class="bg-white rounded-2xl shadow-sm p-3">
                <p id="c-products" class="text-2xl font-black text-green-600">-</p>
                <p class="text-[11px] text-slate-500">মোট পণ্য</p>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <a href="order-list.html" class="bg-white rounded-2xl shadow-sm p-4 font-bold text-slate-700">📦 অর্ডার তালিকা</a>
            <a href="add-product.html" class="bg-white rounded-2xl shadow-sm p-4 font-bold text-slate-700">➕ পণ্য যোগ</a>
            <a href="manage-product.html" class="bg-white rounded-2xl shadow-sm p-4 font-bold text-slate-700">🛒 পণ্য ম্যানেজ</a>
            <a href="manage-users.html" class="bg-white rounded-2xl shadow-sm p-4 font-bold text-slate-700">👥 হেলপার/ডেলিভারি</a>
            <a href="withdraw-requests.html" class="bg-white rounded-2xl shadow-sm p-4 font-bold text-slate-700">💸 উইথড্র</a>
            <a href="delivery-setting.html" class="bg-white rounded-2xl shadow-sm p-4 font-bold text-slate-700">🚚 ডেলিভারি চার্জ</a>
            <a href="report.html" class="col-span-2 bg-green-600 text-white rounded-2xl shadow-sm p-4 font-bold text-center">📊 হিসাব ও রিপোর্ট</a>
        </div>
        <a href="index.html" class="block text-center text-xs text-slate-400">দোকান দেখুন →</a>
    </main>

    <script type="module">
        import { db } from "./firebase-config.js";
        import { requireRole, logout } from "./auth-guard.js";
        import { collection, query, where, getCountFromServer }
            from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const { profile } = await requireRole(['owner']);
        document.getElementById('who').textContent = profile.name || profile.email || "";
        document.getElementById('logout-btn').onclick = logout;

        async function count(q, id) {
            try {
                const s = await getCountFromServer(q);
                document.getElementById(id).textContent = s.data().count;
            } catch (e) { console.error(e); document.getElementById(id).textContent = "!"; }
        }
        count(query(collection(db, "orders"), where("status", "==", "pending")), "c-orders");
        count(query(collection(db, "withdraw_requests"), where("status", "==", "pending")), "c-withdraw");
        count(collection(db, "products"), "c-products");
    </script>
</body>
</html>
