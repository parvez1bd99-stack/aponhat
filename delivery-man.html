<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ডেলিভারি | আপন হাট</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap">
    <style>body { font-family: 'Hind Siliguri', sans-serif; }</style>
</head>
<body style="display:none" class="bg-slate-100 min-h-screen pb-10">
    <header class="bg-green-700 text-white sticky top-0 z-20 shadow">
        <div class="p-4 flex justify-between items-center">
            <div>
                <h1 class="font-bold text-lg">আমার ডেলিভারি</h1>
                <p id="who" class="text-xs opacity-80"></p>
            </div>
            <button id="logout-btn" class="text-xs bg-red-500 px-3 py-2 rounded-xl font-bold">লগআউট</button>
        </div>
        <div id="tabs" class="flex gap-2 px-4 pb-3"></div>
    </header>

    <main class="max-w-lg mx-auto p-3 space-y-3">
        <!-- ওয়ালেট -->
        <section class="bg-gradient-to-br from-green-600 to-green-800 text-white rounded-3xl p-5 shadow">
            <p class="text-xs opacity-80">আমার ওয়ালেট</p>
            <p id="balance" class="text-4xl font-black mt-1">৳০</p>
            <div class="flex justify-between text-xs mt-3 opacity-90">
                <span>মোট আয়: <b id="earned">৳০</b></span>
                <span>প্রতি ডেলিভারিতে: <b id="rate">০%</b> (চার্জের)</span>
            </div>
            <button id="toggle-withdraw" class="mt-4 w-full bg-white text-green-700 py-3 rounded-xl font-bold active:scale-95 transition">💸 টাকা তুলুন (বিকাশ)</button>
        </section>

        <form id="withdraw-form" class="hidden bg-white rounded-3xl shadow-sm p-4 space-y-3">
            <h2 class="font-bold text-slate-700">উইথড্র আবেদন</h2>
            <input id="w-amount" type="number" min="1" step="1" required placeholder="কত টাকা তুলবেন?" class="w-full p-3 border rounded-xl">
            <input id="w-bkash" inputmode="tel" maxlength="11" required placeholder="বিকাশ নম্বর (01XXXXXXXXX)" class="w-full p-3 border rounded-xl">
            <p class="text-[11px] text-slate-400">সর্বনিম্ন <span id="min-w"></span> টাকা। মালিক যাচাই করে বিকাশে পাঠাবেন।</p>
            <button id="w-btn" type="submit" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold disabled:opacity-60">আবেদন পাঠান</button>
            <p id="w-msg" class="text-center text-sm font-bold"></p>
        </form>

        <div id="state" class="text-center text-slate-400 py-16">লোড হচ্ছে...</div>
        <div id="list" class="space-y-3"></div>

        <section class="pt-2">
            <h2 class="font-bold text-slate-700 mb-2">উইথড্র আবেদন</h2>
            <div id="w-list" class="space-y-2"></div>
        </section>
    </main>

    <script type="module">
        import { db } from "./firebase-config.js";
        import { requireRole, logout } from "./auth-guard.js";
        import { collection, query, where, onSnapshot, doc, getDoc, addDoc, updateDoc, serverTimestamp }
            from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const { user, profile } = await requireRole(['delivery']);
        const $ = (id) => document.getElementById(id);
        const taka = (n) => "৳" + Number(n || 0).toLocaleString("bn-BD");

        $("who").textContent = profile.name || profile.email || "";
        $("logout-btn").onclick = logout;

        // ---------- ওয়ালেট (লাইভ) ----------
        const MIN_WITHDRAW = 100; // সর্বনিম্ন উইথড্র (টাকা), চাইলে বদলান
        let me = profile;
        let withdraws = [];
        $("min-w").textContent = MIN_WITHDRAW.toLocaleString("bn-BD");
        onSnapshot(doc(db, "users", user.uid), (s) => {
            if (!s.exists()) return;
            me = { id: s.id, ...s.data() };
            $("balance").textContent = taka(me.walletBalance);
            $("earned").textContent = taka(me.totalEarned);
            $("rate").textContent = (Number(me.deliveryCommissionRate) || 0).toLocaleString("bn-BD") + "%";
        });
        $("toggle-withdraw").onclick = () => $("withdraw-form").classList.toggle("hidden");

        const WSTAT = {
            pending:  { t: "অপেক্ষমাণ", c: "bg-orange-100 text-orange-700" },
            paid:     { t: "পাঠানো হয়েছে", c: "bg-green-100 text-green-700" },
            rejected: { t: "বাতিল", c: "bg-red-100 text-red-700" }
        };
        onSnapshot(query(collection(db, "withdraw_requests"), where("helperId", "==", user.uid)), (snap) => {
            withdraws = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
            const box = $("w-list");
            box.innerHTML = "";
            if (!withdraws.length) box.append(h("p", { class: "text-center text-slate-400 text-sm py-3", text: "কোনো আবেদন নেই" }));
            withdraws.forEach(w => {
                const st = WSTAT[w.status] || { t: w.status, c: "bg-slate-100" };
                box.append(h("div", { class: "bg-white rounded-2xl shadow-sm p-3 flex justify-between items-center" },
                    h("div", {},
                        h("p", { class: "font-bold text-slate-800", text: taka(w.amount) }),
                        h("p", { class: "text-[11px] text-slate-400", text: `বিকাশ ${w.bkashNumber || ""} • ${w.createdAt?.toDate ? w.createdAt.toDate().toLocaleDateString("bn-BD") : ""}` })),
                    h("span", { class: `text-[10px] font-bold px-2 py-1 rounded-full ${st.c}`, text: st.t })));
            });
        }, (e) => console.error(e));

        let sending = false;
        $("withdraw-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            if (sending) return;
            const msg = $("w-msg");
            const setMsg = (t, ok) => { msg.textContent = t; msg.className = "text-center text-sm font-bold " + (ok ? "text-green-600" : "text-red-600"); };
            const amount = Number($("w-amount").value);
            const bkash = $("w-bkash").value.replace(/\s/g, "");
            if (!Number.isInteger(amount) || amount < MIN_WITHDRAW) return setMsg(`সর্বনিম্ন ${MIN_WITHDRAW} টাকা তুলতে পারবেন`);
            if (amount > (Number(me.walletBalance) || 0)) return setMsg("ওয়ালেটে এত টাকা নেই");
            if (!/^01[3-9]\d{8}$/.test(bkash)) return setMsg("সঠিক ১১ ডিজিটের বিকাশ নম্বর দিন");
            if (withdraws.some(w => w.status === "pending")) return setMsg("আগের আবেদনটি এখনো অপেক্ষমাণ আছে");
            sending = true;
            $("w-btn").disabled = true;
            try {
                await addDoc(collection(db, "withdraw_requests"), {
                    helperId: user.uid, helperName: me.name || "", bkashNumber: bkash, amount,
                    requesterRole: "delivery", status: "pending", createdAt: serverTimestamp()
                });
                setMsg("আবেদন পাঠানো হয়েছে!", true);
                $("withdraw-form").reset();
            } catch (err) {
                console.error(err);
                setMsg("আবেদন যায়নি: " + (err.code || err.message));
            } finally { sending = false; $("w-btn").disabled = false; }
        });

        // পণ্য কোথা থেকে নিতে হবে (মালিকের সেট করা ঠিকানা)
        let shop = null;
        try {
            const sh = await getDoc(doc(db, "settings", "shop"));
            if (sh.exists()) shop = sh.data();
        } catch (e) { console.error(e); }

        function h(tag, props = {}, ...kids) {
            const e = document.createElement(tag);
            for (const [k, v] of Object.entries(props)) {
                if (k === "class") e.className = v;
                else if (k === "text") e.textContent = v;
                else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
                else if (v !== undefined && v !== null) e.setAttribute(k, v);
            }
            for (const kid of kids.flat()) if (kid != null) e.append(kid);
            return e;
        }

        let orders = [];
        let tab = "active"; // active | done

        // শুধু নিজের অ্যাসাইন করা অর্ডার (রুলসও এটাই মানে)
        onSnapshot(query(collection(db, "orders"), where("deliveryManId", "==", user.uid)), (snap) => {
            orders = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
            $("state").style.display = "none";
            render();
        }, (err) => {
            console.error(err);
            $("state").style.display = "block";
            $("state").textContent = "অর্ডার লোড হয়নি: " + (err.code || err.message);
        });

        function render() {
            const active = orders.filter(o => o.status === "confirmed" || o.status === "shipping");
            const done = orders.filter(o => o.status === "delivered");

            const tabs = $("tabs");
            tabs.innerHTML = "";
            [["active", `চলমান (${active.length.toLocaleString("bn-BD")})`], ["done", `সম্পন্ন (${done.length.toLocaleString("bn-BD")})`]]
                .forEach(([key, label]) => tabs.append(h("button", {
                    class: "flex-1 py-2 rounded-2xl text-xs font-bold " + (tab === key ? "bg-white text-green-700" : "bg-green-800 text-white"),
                    text: label, onclick: () => { tab = key; render(); }
                })));

            const list = $("list");
            list.innerHTML = "";
            const shown = tab === "active" ? active : done;
            if (!shown.length) {
                list.append(h("p", { class: "text-center text-slate-400 py-12", text: tab === "active" ? "এখন কোনো ডেলিভারি নেই" : "কোনো সম্পন্ন ডেলিভারি নেই" }));
                return;
            }
            shown.forEach(o => list.append(card(o)));
        }

        async function setStatus(btn, o, status) {
            if (btn.disabled) return;
            const old = btn.textContent;
            btn.disabled = true; btn.textContent = "...";
            try {
                const data = { status };
                if (status === "delivered") data.deliveredAt = serverTimestamp();
                await updateDoc(doc(db, "orders", o.id), data);
            } catch (e) {
                console.error(e);
                alert("আপডেট হয়নি: " + (e.code === "permission-denied" ? "অনুমতি নেই বা অর্ডারের অবস্থা বদলে গেছে" : (e.code || e.message)));
                btn.disabled = false; btn.textContent = old;
            }
        }

        function card(o) {
            const items = (o.items || []).map(i => h("p", { class: "text-xs", text: `• ${i.name} × ${i.qty}` }));
            const addr = o.customerAddress || "";
            const shipping = o.status === "shipping";
            const doneOrder = o.status === "delivered";

            const actions = [];
            if (o.status === "confirmed") {
                const b = h("button", { class: "flex-1 bg-purple-600 text-white py-3 rounded-xl font-bold active:scale-95 transition disabled:opacity-60", text: "🚚 যাত্রা শুরু করুন" });
                b.addEventListener("click", () => setStatus(b, o, "shipping"));
                actions.push(b);
            } else if (shipping) {
                const b = h("button", { class: "flex-1 bg-green-600 text-white py-3 rounded-xl font-bold active:scale-95 transition disabled:opacity-60", text: "✔ ডেলিভারি সম্পন্ন" });
                b.addEventListener("click", () => {
                    if (confirm(`গ্রাহকের কাছ থেকে ${taka(o.totalBill)} বুঝে পেয়েছেন এবং পণ্য দিয়েছেন?`)) setStatus(b, o, "delivered");
                });
                actions.push(b);
            }

            const rateUsed = Number(o.deliveryManRate ?? me.deliveryCommissionRate ?? 0) || 0;
            const earnAmt = Math.round((Number(o.deliveryCharge) || 0) * rateUsed / 100);
            const earnLine = h("p", { class: "text-sm font-bold text-blue-700 bg-blue-50 rounded-xl px-3 py-2",
                text: doneOrder
                    ? (o.deliveryPayProcessed ? `💰 আপনার আয়: ${taka(o.deliveryEarned)} (ওয়ালেটে যোগ হয়েছে)` : "💰 আপনার আয় ওয়ালেটে যোগ হবে...")
                    : `💰 এই ডেলিভারিতে আপনার আয়: ${taka(earnAmt)}` });

            const pickup = doneOrder ? null : h("div", { class: "bg-amber-50 border border-amber-200 rounded-xl p-3 space-y-1" },
                h("p", { class: "text-xs font-bold text-amber-700", text: "📦 পণ্য নেওয়ার স্থান" }),
                shop && shop.address
                    ? [h("p", { class: "text-sm font-bold text-slate-800", text: (shop.name ? shop.name + " — " : "") + shop.address }),
                       shop.phone ? h("a", { href: "tel:" + shop.phone, class: "text-xs text-blue-600 font-bold", text: "📞 " + shop.phone }) : null]
                    : h("p", { class: "text-xs text-slate-500", text: "মালিক এখনো ঠিকানা দেননি, মালিককে ফোন করুন।" }));

            return h("div", { class: "bg-white rounded-3xl shadow-sm p-4 space-y-2" },
                h("div", { class: "flex justify-between items-start" },
                    h("p", { class: "font-bold text-slate-800", text: o.customerName || "" }),
                    h("span", { class: "text-[10px] text-slate-400", text: "#" + o.id.slice(0, 8).toUpperCase() })),
                pickup,
                h("p", { class: "text-sm text-slate-600", text: "📍 গ্রাহকের ঠিকানা: " + addr }),
                h("div", { class: "flex gap-2" },
                    h("a", { href: "tel:" + (o.customerPhone || ""), class: "flex-1 text-center bg-blue-50 text-blue-600 py-2 rounded-xl text-xs font-bold", text: "📞 কল করুন" }),
                    addr && o.deliveryMethod !== "shop"
                        ? h("a", { href: "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(addr), target: "_blank", rel: "noopener", class: "flex-1 text-center bg-slate-100 text-slate-700 py-2 rounded-xl text-xs font-bold", text: "🗺 ম্যাপ" })
                        : null),
                h("div", { class: "bg-slate-50 rounded-xl p-3" }, items),
                h("div", { class: "flex justify-between items-center bg-green-50 rounded-xl p-3" },
                    h("span", { class: "text-xs text-green-800 font-bold", text: doneOrder ? "আদায় হয়েছে" : "আদায় করুন (ক্যাশ)" }),
                    h("span", { class: "text-xl font-black text-green-700", text: taka(o.totalBill) })),
                earnLine,
                actions.length ? h("div", { class: "flex gap-2 pt-1" }, actions) : null);
        }
    </script>
</body>
</html>
